<!DOCTYPE html>
<html>
<head>
  <title>GitHub Registration Form</title>
</head>
<body>
  <h2>GitHub Registration Form</h2>
  <p>Please fill in this form to create your GitHub account.</p>

  <form method="POST" action="/register">
    <label>Full Name:</label><br>
    <input type="text" name="fullname" placeholder="Enter your full name" required><br><br>

    <label>Username:</label><br>
    <input type="text" name="username" placeholder="Choose a username" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" placeholder="Enter your email" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" placeholder="Create a password" required><br><br>

    <label>Confirm Password:</label><br>
    <input type="password" name="confirm_password" placeholder="Re-enter password" required><br><br>

    <input type="submit" value="Register">
  </form>
  <p>Already have an account? <a href="#">Login here</a></p>
</body>
</html>
